<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinolike</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=14">
  <link rel="stylesheet" href="/css/components.css?v=20">
  <link rel="stylesheet" href="/css/animations.css?v=12">
  <link rel="stylesheet" href="/vendor/plyr/plyr.css?v=3.8.4">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="header-inner">
      <a href="#/" class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="2"/>
          <path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 7h5M17 17h5"/>
        </svg>
        <span class="logo-text">Kinolike</span>
      </a>
      
      <nav class="nav" id="nav">
        <a href="#/" class="nav-link active" data-page="home">Главная</a>
        <a href="#/want" class="nav-link" data-page="want">Хочу посмотреть</a>
        <a href="#/watched" class="nav-link" data-page="watched">Просмотренные</a>
        <a href="#/recommendations" class="nav-link" data-page="recommendations">Рекомендации</a>
      </nav>
      
      <div class="header-actions">
        <div class="search-wrapper" id="searchWrapper">
          <input type="text" class="search-input" id="searchInput" placeholder="Поиск фильмов и сериалов...">
          <div class="search-results" id="searchResults"></div>
        </div>
        
        <div class="user-menu" id="userMenu">
          <button class="user-btn" id="userBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </button>
          <div class="user-dropdown" id="userDropdown">
            <div id="authButtons">
              <a href="#/login" class="dropdown-item">Войти</a>
              <a href="#/register" class="dropdown-item">Регистрация</a>
            </div>
            <div id="userActions" style="display:none">
              <div class="dropdown-header" id="dropdownUser"></div>
              <a href="#/profile" class="dropdown-item">Профиль</a>
              <a href="#/profile" class="dropdown-item">Статистика</a>
              <button class="dropdown-item" id="logoutBtn">Выйти</button>
            </div>
          </div>
        </div>
        
        <button class="mobile-search-btn" id="mobileSearchBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
        <button class="hamburger" id="hamburger">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Nav -->
  <div class="mobile-nav" id="mobileNav">
    <a href="#/" class="mobile-nav-link" data-page="home">Главная</a>
    <a href="#/want" class="mobile-nav-link" data-page="want">Хочу посмотреть</a>
    <a href="#/watched" class="mobile-nav-link" data-page="watched">Просмотренные</a>
    <a href="#/recommendations" class="mobile-nav-link" data-page="recommendations">Рекомендации</a>
  </div>

  <!-- Main Content -->
  <main class="main" id="app">
    <div class="loading-spinner" id="globalLoader">
      <div class="spinner"></div>
    </div>
  </main>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal Container -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- Video Player Overlay -->
  <div class="video-player-overlay" id="videoPlayerOverlay">
    <div class="video-player-header">
      <span class="title" id="videoPlayerTitle"></span>
      <button class="close-btn" id="videoPlayerClose" type="button" aria-label="Закрыть плеер">&times;</button>
    </div>
    <div class="video-player-body">
      <video id="videoPlayerElement" controls playsinline></video>
    </div>
  </div>

  <!-- Mobile Search Overlay -->
  <div class="mobile-search-overlay" id="mobileSearchOverlay">
    <div class="mobile-search-header">
      <button class="mobile-search-close" id="mobileSearchClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
      <input type="text" class="mobile-search-input" id="mobileSearchInput" placeholder="Поиск фильмов и сериалов..." autofocus>
    </div>
    <div class="mobile-search-results" id="mobileSearchResults"></div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js?v=15"></script>
  <script src="/js/ui.js?v=12"></script>
  <script src="/js/auth.js?v=12"></script>
  <script src="/js/movies.js?v=14"></script>
  <script src="/js/lists.js?v=14"></script>
  <script src="/js/player.js?v=2"></script>
  <script src="/vendor/plyr/plyr.js?v=3.8.4"></script>
  <script src="/js/detail.js?v=23"></script>
  <script src="/js/watched.js?v=12"></script>
  <script src="/js/recommendations.js?v=17"></script>
  <script src="/js/stats.js?v=12"></script>
  <script src="/js/search.js?v=14"></script>
  <script src="/js/app.js?v=12"></script>
</body>
</html>
