services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinolike}
      POSTGRES_USER: ${POSTGRES_USER:-kinolike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinolike_secret}
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinolike}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - /mnt/server/movies:/mnt/server/movies
      - /mnt/server/serials:/mnt/server/serials
      - image-cache:/app/server/cache/images
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg-data:
  image-cache:
